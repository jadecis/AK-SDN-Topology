name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5
        run: sudo apt-get update && sudo apt-get install -y build-essential qtbase5-dev qt5-qmake libqt5svg5-dev
      - name: Build application
        run: bash build.sh
      - name: Check Python syntax
        run: python3 -m compileall -q resources/templates tools examples
